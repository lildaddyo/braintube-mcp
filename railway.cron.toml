# Config-as-code for the Railway service rnd-daily-cron (service setting "Config file" = /railway.cron.toml).
# railway.toml belongs to the MCP server. Railway has no [[services]] table, so the rnd-daily cron
# declared there from 2026-05-31 was never scheduled; a second service needs its own file.
[build]
builder = "dockerfile"

[deploy]
startCommand = "node dist/cron/rnd-daily.js"
cronSchedule = "0 3 * * *"
restartPolicyType = "never"
